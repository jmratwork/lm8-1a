---
phishing_simulator_compose_dir: /opt/phishing-simulator
dockerhub_username: ""
dockerhub_password: ""
phishing_simulator_docker_image: gophish/gophish:latest
phishing_simulator_admin_port: 3333
phishing_simulator_phishing_port: 80
phishing_simulator_smtp_host: 10.20.10.60
phishing_simulator_smtp_port: 1025
# Phishing sender. Its TLD (.net) is the answer to training L13, and it MUST
# differ from the TLD of the corporate staff directory served at
# lms.internal:8080/module2/ (company-corp.com) so L20 stays MISMATCH. Keep the
# lms-content var lms_content_phishing_from_address in sync if you change this.
phishing_simulator_from_address: "security@company-corp.net"
phishing_simulator_healthcheck:
  port: "{{ phishing_simulator_admin_port }}"
  timeout: 120
  delay: 5

# --- LAUNCH_CAMPAIGN (Gate 1) automation -----------------------------------
# Recipient roster used by launch_campaign.py to build the GoPhish target group.
# These are lab addresses: with the MailHog Lab Relay sending profile every
# message is captured by Mailpit (mail-relay.internal:8025), nothing leaves the
# range. Override per cohort via group_vars or -e phishing_simulator_trainees=...
phishing_simulator_trainees:
  - {first_name: "Trainee", last_name: "One", email: "trainee01@cynet.lab", position: "Staff"}
  - {first_name: "Trainee", last_name: "Two", email: "trainee02@cynet.lab", position: "Staff"}

# Names of the GoPhish objects launch_campaign.py reuses/creates (overridable).
# Template / page / group are reused by name (idempotent); only the campaign is
# (re)created on each launch, with a timestamp suffix to keep the name unique.
phishing_simulator_campaign_name: "Security Compliance Drill"
phishing_simulator_template_name: "IT Security Compliance Notice"
phishing_simulator_page_name: "Compliance Verification Landing"
phishing_simulator_group_name: "Cohort Trainees"
# Existing sending profile pre-configured by this role (do not rename here).
phishing_simulator_smtp_profile_name: "MailHog Lab Relay"
# Subject line for the phishing email template (configurable; the template HTML
# body itself is a training answer and is NEVER modified by the launcher).
phishing_simulator_email_subject: "URGENT: IT Security Compliance Action Required"
# Landing URL the phishing link points at (GoPhish serves the page on port 80).
phishing_simulator_campaign_url: "http://phishing-simulator.internal"
