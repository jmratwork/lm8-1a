---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - sqlite3
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create GoPhish compose directory
  ansible.builtin.file:
    path: "{{ phishing_simulator_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy GoPhish configuration (TLS disabled for lab)
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ phishing_simulator_compose_dir }}/config.json"
    owner: root
    group: root
    mode: "0644"
  notify: restart gophish

- name: Log in to Docker Hub to avoid pull rate limits
  ansible.builtin.command:
    cmd: docker login --username "{{ dockerhub_username }}" --password-stdin
    stdin: "{{ dockerhub_password }}"
  no_log: true
  when:
    - dockerhub_username | default('') | length > 0
    - dockerhub_password | default('') | length > 0

- name: Configure Docker daemon registry mirror
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: '{"registry-mirrors": ["https://mirror.gcr.io"]}'
    mode: '0644'
  notify: restart docker daemon

- name: Flush handlers to apply mirror before pull
  ansible.builtin.meta: flush_handlers

- name: Deploy GoPhish Docker Compose definition
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ phishing_simulator_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart gophish

- name: Apply pending GoPhish configuration restarts
  ansible.builtin.meta: flush_handlers

- name: Pull GoPhish image via registry mirror
  ansible.builtin.command:
    cmd: docker pull mirror.gcr.io/gophish/gophish:latest
  args:
    chdir: /opt/phishing-simulator

- name: Tag GoPhish mirror image as canonical name
  ansible.builtin.command:
    cmd: docker tag mirror.gcr.io/gophish/gophish:latest gophish/gophish:latest

- name: Start GoPhish service
  ansible.builtin.command:
    cmd: docker compose up -d --pull never
  args:
    chdir: /opt/phishing-simulator
  register: gophish_start
  changed_when: "'Started' in gophish_start.stdout or 'Created' in gophish_start.stdout"

- name: Wait for GoPhish admin port to become available
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ phishing_simulator_healthcheck.port }}"
    timeout: "{{ phishing_simulator_healthcheck.timeout }}"
    delay: "{{ phishing_simulator_healthcheck.delay }}"
    sleep: 2

# Bootstrap is idempotent and detects real platform state on EVERY run.
# The GoPhish database lives in the `gophish-data` Docker volume (see
# docker-compose.yml.j2), NOT in the host admin_credentials.txt file, so the
# state of the platform is derived from the volume/API directly rather than
# from the presence of a sentinel file on the host. This guarantees the SMTP
# sending profile is reconciled even when the volume is recreated.

# Best-effort recovery of the initial admin password. It is only present in the
# container logs on a fresh boot; on later runs the line may be gone, which is
# expected and must not be treated as an error.
- name: Retrieve GoPhish initial admin password from container logs
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      docker logs gophish 2>&1
      | grep -i 'Please login'
      | sed 's/.*password //'
      | tr -d '"' | tr -d "'" | tr -d ' '
      | tail -1
  args:
    executable: /bin/bash
  register: gophish_init_pass
  changed_when: false
  failed_when: false
  no_log: true

- name: Save GoPhish admin credentials when the initial password is recoverable
  ansible.builtin.copy:
    content: |
      GoPhish Admin Panel
      ===================
      URL:      http://{{ ansible_host }}:{{ phishing_simulator_admin_port }}/
      Username: admin
      Password: {{ gophish_init_pass.stdout | trim }}

      IMPORTANT: Change this password after first login.
      The password above is valid only until the instructor changes it via the UI.
    dest: "{{ phishing_simulator_compose_dir }}/admin_credentials.txt"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: gophish_init_pass.stdout | default('') | trim | length > 0

- name: Warn when the initial admin password is no longer in the logs
  ansible.builtin.debug:
    msg: >-
      GoPhish initial admin password was not found in the container logs.
      Any existing admin_credentials.txt has been left untouched (it may have
      already been changed via the UI). This is not a failure.
  when: gophish_init_pass.stdout | default('') | trim | length == 0

# Always read the live API key straight from the GoPhish database. This works
# regardless of whether the host credentials file exists, so SMTP reconciliation
# below cannot be skipped by a stale sentinel file.
- name: Get GoPhish API key from database
  ansible.builtin.shell:
    cmd: >-
      docker cp gophish:/opt/gophish/gophish.db /tmp/gophish_apikey.db &&
      sqlite3 /tmp/gophish_apikey.db
      "SELECT api_key FROM users WHERE username='admin';" &&
      rm -f /tmp/gophish_apikey.db
  register: gophish_api_key
  no_log: true
  changed_when: false

# Pre-configure the MailHog SMTP sending profile so campaigns can be launched
# immediately after the instructor logs in. Idempotent: query first, create only
# when missing. status_code [201, 409] tolerates a concurrent create race.
- name: Fetch existing GoPhish SMTP sending profiles
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ phishing_simulator_admin_port }}/api/smtp/"
    method: GET
    headers:
      X-API-KEY: "{{ gophish_api_key.stdout | trim }}"
    status_code: [200]
  register: gophish_smtp_profiles
  no_log: true

- name: Pre-configure MailHog SMTP sending profile in GoPhish
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ phishing_simulator_admin_port }}/api/smtp/"
    method: POST
    headers:
      X-API-KEY: "{{ gophish_api_key.stdout | trim }}"
    body_format: json
    body:
      name: "MailHog Lab Relay"
      host: "{{ phishing_simulator_smtp_host }}:{{ phishing_simulator_smtp_port }}"
      from_address: "{{ phishing_simulator_from_address }}"
      ignore_cert_errors: true
      headers: []
    status_code: [201, 409]
  register: gophish_smtp_create
  no_log: true
  when: >-
    gophish_smtp_profiles.json | default([])
    | selectattr('name', 'equalto', 'MailHog Lab Relay')
    | list | length == 0

# Deploy phishing email HTML template file (used as reference; instructor
# imports it via GoPhish UI at Admin → Email Templates → Import Email).
- name: Deploy phishing email template reference file
  ansible.builtin.copy:
    src: phishing-email.html
    dest: "{{ phishing_simulator_compose_dir }}/phishing_email_template.html"
    owner: root
    group: root
    mode: "0644"

# Fail-fast verification: do NOT let the deploy finish green if GoPhish is not
# actually ready to launch campaigns. Without this, a recreated `gophish-data`
# volume could leave the platform half-configured while the play still reported
# failed=0, blocking the trainee in Phase 2 (levels 12-18, 22, 24).
- name: Assert that the GoPhish API key was recovered
  ansible.builtin.assert:
    that:
      - gophish_api_key.stdout | default('') | trim | length > 0
    fail_msg: >-
      GoPhish API key could not be retrieved from the database. GoPhish is NOT
      operational and the instructor cannot launch phishing campaigns. No mail
      will reach Mailpit and training levels 12-18, 22 and 24 will be unsolvable.
    success_msg: "GoPhish API key successfully retrieved."

- name: Re-fetch GoPhish SMTP sending profiles for verification
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ phishing_simulator_admin_port }}/api/smtp/"
    method: GET
    headers:
      X-API-KEY: "{{ gophish_api_key.stdout | trim }}"
    status_code: [200]
  register: gophish_smtp_verify
  no_log: true

- name: Assert that the MailHog Lab Relay SMTP profile exists
  ansible.builtin.assert:
    that:
      - >-
        gophish_smtp_verify.json | default([])
        | selectattr('name', 'equalto', 'MailHog Lab Relay')
        | list | length > 0
    fail_msg: >-
      The 'MailHog Lab Relay' SMTP sending profile is missing from GoPhish.
      Campaigns cannot be launched, no mail reaches Mailpit, and training
      levels 12-18, 22 and 24 become unsolvable.
    success_msg: "MailHog Lab Relay SMTP profile is present; GoPhish is ready."
