---
# nginx is already installed by the rep-core role on rep-practical-labs.
# This role only adds a new virtual host on port 8080 and deploys course content.

- name: Create LMS web root directory
  ansible.builtin.file:
    path: "{{ lms_content_web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Create LMS course subdirectories
  ansible.builtin.file:
    path: "{{ lms_content_web_root }}/{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop:
    - module1
    - module2
    - module3
    - feedback

# module1/ and module3/ are theory tabs inside the single-page portal
# (index.html), not standalone pages, so those directories would otherwise be
# empty and a direct visit would return 403/404. Deploy a tiny stub that
# redirects to the portal so a stray visit never dead-ends. module2/ is a real
# page (corporate directory, L20), deployed below — do not add a stub there.
- name: Deploy redirect stub for unused module directories
  ansible.builtin.copy:
    dest: "{{ lms_content_web_root }}/{{ item }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta http-equiv="refresh" content="0; url=/">
        <title>Redirecting to the course portal</title>
      </head>
      <body>
        <p>This module is part of the main course portal.
           <a href="/">Return to the LMS portal</a>.</p>
      </body>
      </html>
  loop:
    - module1
    - module3

- name: Deploy feedback section placeholder
  ansible.builtin.copy:
    dest: "{{ lms_content_web_root }}/feedback/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Feedback — Phishing Awareness Training</title>
        <style>
          body{font-family:Arial,sans-serif;background:#f0f2f5;display:flex;
               align-items:center;justify-content:center;min-height:100vh;margin:0;}
          .card{background:#fff;border-radius:6px;padding:32px 40px;
                box-shadow:0 1px 4px rgba(0,0,0,.1);max-width:520px;text-align:center;}
          h1{color:#1a3a5c;font-size:20px;margin-bottom:12px;}
          p{color:#555;font-size:14px;line-height:1.7;margin-bottom:16px;}
          a.btn{display:inline-block;background:#1a3a5c;color:#fff;padding:10px 22px;
                border-radius:4px;text-decoration:none;font-size:14px;}
          .inbox{background:#f5f5f5;border:1px solid #ddd;border-radius:4px;
                 padding:8px 14px;font-family:monospace;font-size:13px;margin:12px 0;}
        </style>
      </head>
      <body>
        <div class="card">
          <h1>Your Personalised Feedback</h1>
          <p>Your score and improvement recommendations have been sent to your
             lab email inbox. Open the link below to view them:</p>
          <div class="inbox">http://mail-relay.internal:8025/</div>
          <p>Individual feedback pages will appear in this directory once the
             instructor runs <strong>PUBLISH_FEEDBACK</strong> from the console.</p>
          <a class="btn" href="http://mail-relay.internal:8025/">Open Lab Inbox &rarr;</a>
        </div>
      </body>
      </html>

# Corporate staff directory for the sender-verification exercise (L20).
# IMPORTANT: the IT Security entry below MUST use a different TLD from the
# phishing sender phishing_simulator_from_address (.net). The .com here vs .net
# in the phishing From is exactly what makes L20 resolve to MISMATCH; if both
# used the same TLD the level would break. The content check at the end of this
# role enforces that invariant.
- name: Deploy corporate staff directory for sender verification exercise
  ansible.builtin.copy:
    dest: "{{ lms_content_web_root }}/module2/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Corporate Staff Directory</title>
        <style>
          body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 30px; }
          h1 { color: #1a3a5c; }
          p { color: #555; font-size: 14px; margin-bottom: 20px; }
          table { border-collapse: collapse; width: 100%; max-width: 700px;
                  background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
          th { background: #1a3a5c; color: #fff; padding: 10px 16px;
               text-align: left; font-size: 14px; }
          td { padding: 10px 16px; font-size: 14px; border-bottom: 1px solid #eee; }
          tr:last-child td { border-bottom: none; }
        </style>
      </head>
      <body>
        <h1>Corporate Staff Directory</h1>
        <p>Use this directory to verify the email address of a sender before
           responding or clicking any links.</p>
        <table>
          <thead>
            <tr><th>Department</th><th>Contact</th><th>Official Email</th></tr>
          </thead>
          <tbody>
            <tr><td>IT Security</td><td>Security Team</td><td>security@company-corp.com</td></tr>
            <tr><td>Human Resources</td><td>HR Department</td><td>hr@company-corp.com</td></tr>
            <tr><td>Finance</td><td>Finance Team</td><td>finance@company-corp.com</td></tr>
            <tr><td>IT Helpdesk</td><td>Support Desk</td><td>helpdesk@company-corp.com</td></tr>
            <tr><td>Management</td><td>Executive Office</td><td>exec@company-corp.com</td></tr>
          </tbody>
        </table>
      </body>
      </html>

- name: Deploy LMS course portal index page
  ansible.builtin.template:
    src: course-index.html.j2
    dest: "{{ lms_content_web_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
  notify: reload nginx lms

- name: Deploy LMS nginx virtual host configuration
  ansible.builtin.template:
    src: nginx-lms.conf.j2
    dest: "{{ lms_content_nginx_site }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx lms

- name: Enable LMS nginx site
  ansible.builtin.file:
    src: "{{ lms_content_nginx_site }}"
    dest: "{{ lms_content_nginx_site_enabled }}"
    state: link
  notify: reload nginx lms

- name: Apply pending nginx reloads
  ansible.builtin.meta: flush_handlers

- name: Validate LMS portal is responding
  ansible.builtin.uri:
    url: "{{ lms_content_healthcheck.url }}"
    method: GET
    status_code: "{{ lms_content_healthcheck.status_code }}"
  changed_when: false
  retries: 3
  delay: 3

# --- Content guardrails (check-only, idempotent) ----------------------------
# Preventive assertions: fail loudly if deployed LMS content drifts away from
# the literals the training answers depend on, so a future edit can never leave
# a trainee with an unsolvable level. These only GET already-served pages.
- name: Fetch deployed LMS index for content checks
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ lms_content_port }}/"
    method: GET
    return_content: true
    status_code: [200]
  register: lms_content_index_check
  changed_when: false

- name: Assert LMS index still contains the training answer literals
  ansible.builtin.assert:
    that:
      - "'Typosquatting' in lms_content_index_check.content"
      - "'.ps1' in lms_content_index_check.content"
      - "'reporting.internal' in lms_content_index_check.content"
      - "'mail-relay.internal:8025' in lms_content_index_check.content"
      - >-
        lms_content_index_check.content
        | regex_findall('class=\"score-item\"') | length == 4
    fail_msg: >-
      LMS index is missing a literal the training depends on: 'Typosquatting'
      (L5), '.ps1' (L9), 'reporting.internal' (L19), 'mail-relay.internal:8025'
      (L25), or the Assessment Scoring grid no longer has exactly 4 score-item
      cells (L4). Those levels would be left without a valid answer.
    success_msg: >-
      LMS index content matches all dependent answers (L4/L5/L9/L19/L25).
  changed_when: false

- name: Fetch deployed corporate directory (module2) for the MISMATCH check
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ lms_content_port }}/module2/"
    method: GET
    return_content: true
    status_code: [200]
  register: lms_content_module2_check
  changed_when: false

- name: Assert directory TLD differs from phishing sender (L20 MISMATCH)
  ansible.builtin.assert:
    that:
      - directory_domain | length > 0
      - directory_domain | regex_replace('^.*[.]', '') != phishing_tld
    vars:
      directory_domain: >-
        {{ lms_content_module2_check.content
        | regex_search('security@([A-Za-z0-9.-]+)', '\1') | default('') }}
      phishing_tld: >-
        {{ lms_content_phishing_from_address | regex_replace('^.*[.]', '') }}
    fail_msg: >-
      The /module2/ corporate directory IT Security domain shares the TLD of
      the phishing sender ({{ lms_content_phishing_from_address }}): training
      L20 would stop being MISMATCH. Keep the directory on a different TLD
      (e.g. company-corp.com).
    success_msg: >-
      Corporate directory TLD differs from the phishing sender TLD;
      L20 stays MISMATCH.
  changed_when: false
