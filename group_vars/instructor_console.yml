---
# OS password for the ubuntu user on instructor-console.
# Never commit a real value here — supply via environment variable:
#   export INSTRUCTOR_CONSOLE_PASSWORD='<secret>'
# For persistent storage, encrypt with Ansible Vault:
#   ansible-vault encrypt_string '<secret>' --name 'instructor_console_password'
instructor_console_password: "{{ lookup('env', 'INSTRUCTOR_CONSOLE_PASSWORD') }}"
